# CI per pull request — docs/02-architecture.md §9
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TZ: UTC
  # database used by the web e2e stack (the API test suite uses wems_test)
  DATABASE_URL: postgresql://wems:wems@localhost:5432/wems
  TEST_DATABASE_URL: postgresql://wems:wems@localhost:5432/wems_test
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: ap-southeast-1
  S3_ACCESS_KEY: wemsdev
  S3_SECRET_KEY: wemsdev-secret-change-me
  S3_FORCE_PATH_STYLE: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint · typecheck · spec tools · contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-checks-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Spec tools (enum labels, BR/AT references, generated i18n, audit coverage)
        run: pnpm check:spec
      - name: Dependency audit (fail on high — docs/06-security.md §7)
        run: pnpm audit --prod --audit-level high
      - name: Prisma schema is valid
        run: pnpm --filter api prisma validate
      - name: OpenAPI contract is committed (pnpm api:contract)
        run: pnpm api:contract:check

  api:
    name: API unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: wems
          POSTGRES_PASSWORD: wems
          POSTGRES_DB: wems
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wems" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.15-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: wemsdev
          RUSTFS_SECRET_KEY: wemsdev-secret-change-me
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database and buckets
        run: |
          PGPASSWORD=wems psql -h localhost -U wems -d wems -c 'CREATE DATABASE wems_test'
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/health && break; sleep 2; done
          aws --endpoint-url "$S3_ENDPOINT" s3 mb s3://wems-test || true
        env:
          AWS_ACCESS_KEY_ID: wemsdev
          AWS_SECRET_ACCESS_KEY: wemsdev-secret-change-me
          AWS_DEFAULT_REGION: ap-southeast-1
      - name: Chromium for the PDF tests (fake Gotenberg uses playwright-core)
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          echo "CHROME_PATH=$(pnpm --filter web exec node -e "console.log(require('@playwright/test').chromium.executablePath())" | tail -1)" >> "$GITHUB_ENV"
      - name: Migrations match the schema
        run: |
          pnpm --filter api prisma migrate deploy
          pnpm --filter api prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - run: pnpm --filter api test

  web:
    name: Web build + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: wems
          POSTGRES_PASSWORD: wems
          POSTGRES_DB: wems
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wems" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.15-alpine
        ports: ['6379:6379']
      storage:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: wemsdev
          RUSTFS_SECRET_KEY: wemsdev-secret-change-me
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        ports: ['9000:9000']
      # stamped PDF downloads and CRS render through Gotenberg (docs/02-architecture.md §8)
      gotenberg:
        image: gotenberg/gotenberg:8.37.0-chromium
        ports: ['3001:3000']
    env:
      S3_BUCKET: wems-dev
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      COOKIE_SECURE: 'false'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      GOTENBERG_URL: http://localhost:3001
      E2E_ADMIN_EMAIL: admin@example.co.th
      E2E_ADMIN_PASSWORD: ci-admin-password-2569
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Bucket
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/health && break; sleep 2; done
          INIT_ONCE=1 bash infra/storage/init-bucket.sh
        env:
          S3_BUCKETS: wems-dev
          CORS_ORIGINS: http://localhost:3000
          AWS_ACCESS_KEY_ID: wemsdev
          AWS_SECRET_ACCESS_KEY: wemsdev-secret-change-me
          AWS_DEFAULT_REGION: ap-southeast-1
      - name: Build API and web
        run: |
          pnpm --filter api build
          pnpm --filter web build
      - name: Database, seed and first admin
        run: |
          pnpm --filter api prisma migrate deploy
          pnpm --filter api prisma db seed
          pnpm --filter api cli create-admin --email "$E2E_ADMIN_EMAIL" --name "CI Admin" --password "$E2E_ADMIN_PASSWORD"
      - name: Start API, worker and web
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/api && nohup node dist/worker.js > /tmp/worker.log 2>&1 &)
          (cd apps/web && nohup pnpm start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS localhost:4000/api/v1/health/ready && curl -fsS -o /dev/null localhost:3000/login && exit 0; sleep 2; done
          cat /tmp/api.log /tmp/web.log; exit 1
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - if: failure()
        run: tail -n 200 /tmp/api.log /tmp/worker.log /tmp/web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  mobile:
    name: Mobile analyze + test + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # gen-l10n runs on pub get; drift tables need build_runner (generated files are not committed)
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: cp env/dev.example.json env/dev.json
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=env/dev.json
