# WEMS — local development stack (docs/02-architecture.md §9, ADR-0007)
#   docker compose -f infra/docker-compose.yml up -d --wait
# Dev-only credentials below are defaults; override with environment variables if needed.
# Never reuse them outside a developer machine (CLAUDE.md rule 11).
name: wems

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wems
      POSTGRES_PASSWORD: ${WEMS_DB_PASSWORD:-wems}
      POSTGRES_DB: wems
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${WEMS_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first start (empty volume): creates wems_test for integration tests
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wems -d wems']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    # 7.2.x is the last BSD-3-Clause Redis line (7.4+ is RSALv2/SSPL) — CLAUDE.md rule 12, ADR-0007
    image: redis:7.2.15-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${WEMS_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # S3-compatible object storage (RustFS, Apache-2.0). Replaces MinIO, whose images are no longer
    # published — see ADR-0007. The API only talks S3 (S3_* env vars), so this is swappable.
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${WEMS_S3_ACCESS_KEY:-wemsdev}
      RUSTFS_SECRET_KEY: ${WEMS_S3_SECRET_KEY:-wemsdev-secret-change-me}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    ports:
      - '${WEMS_S3_PORT:-9000}:9000' # S3 API
      - '${WEMS_S3_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage-init:
    # Creates the bucket (private, versioning on, lifecycle 90 days for noncurrent versions,
    # CORS for the web app), then stays up so `up --wait` sees every service healthy.
    image: amazon/aws-cli:2.37.6
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${WEMS_S3_ACCESS_KEY:-wemsdev}
      AWS_SECRET_ACCESS_KEY: ${WEMS_S3_SECRET_KEY:-wemsdev-secret-change-me}
      AWS_DEFAULT_REGION: ap-southeast-1
      S3_ENDPOINT: http://storage:9000
      S3_BUCKETS: ${WEMS_S3_BUCKETS:-wems-dev wems-test}
      CORS_ORIGINS: ${WEMS_CORS_ORIGINS:-http://localhost:3000}
    entrypoint: ['bash', '/scripts/init-bucket.sh']
    volumes:
      - ./storage/init-bucket.sh:/scripts/init-bucket.sh:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  mailpit:
    # Catches all outgoing mail — UI http://localhost:8025, API used by e2e tests
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '5000'
      TZ: Asia/Bangkok
    ports:
      - '${WEMS_SMTP_PORT:-1025}:1025'
      - '${WEMS_MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  gotenberg:
    # HTML -> PDF with Chromium (Thai line breaking) — ADR-0003. Chromium-only variant (no LibreOffice).
    image: gotenberg/gotenberg:8.37.0-chromium
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-auto-start=true
      - --log-format=json
    ports:
      - '${WEMS_GOTENBERG_PORT:-3001}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  storage-data:
