# Flutter (apps/mobile) uses its own toolchain and is intentionally excluded — see ADR-0001
packages:
  - apps/*
  - packages/*
  - '!apps/mobile'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - '@types/node@22.20.5'
  - turbo@2.11.7
  - nestjs-pino@5.3.1
  - pino@10.4.0
  - supertest@7.3.1
  - '@aws-sdk/client-s3@3.1146.0'
  - '@aws-sdk/s3-request-presigner@3.1146.0'
