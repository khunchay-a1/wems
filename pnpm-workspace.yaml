# Flutter (apps/mobile) uses its own toolchain and is intentionally excluded — see ADR-0001
packages:
  - apps/*
  - packages/*
  - '!apps/mobile'
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - '@types/node@22.20.5'
  - turbo@2.11.7
